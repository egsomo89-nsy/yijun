<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>유이준 디지털 앨범</title>
  <meta name="description" content="유이준의 탄생부터 성장까지, 가족이 함께 보는 디지털 앨범" />

  <!-- PWA(설치형 웹앱) 설정 -->
  <meta name="theme-color" content="#FFF6EE" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="이준 앨범" />

  <!-- 글꼴: 본문 Pretendard, 제목 Gowun Dodum -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" />

  <!-- Tailwind CSS (CDN) + 파스텔 테마 확장 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '"Malgun Gothic"', '"Apple SD Gothic Neo"', 'sans-serif'],
            display: ['"Gowun Dodum"', '"Pretendard Variable"', 'sans-serif'],
          },
          colors: {
            cream: '#FFF9F3',
            peach: { 50: '#FFF4EC', 100: '#FFE6D5', 200: '#FFD0B5', 300: '#FDB692', 400: '#F59A76', 500: '#E97F5F' },
            ink: '#5B4A44',
          },
          boxShadow: {
            soft: '0 6px 24px -8px rgba(214, 140, 110, 0.28)',
            card: '0 2px 12px -4px rgba(170, 120, 100, 0.18)',
          },
        },
      },
    };
  </script>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: linear-gradient(160deg, #FFF9F3 0%, #FFF1EA 45%, #F3F6FF 100%) fixed;
      color: #5B4A44;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .35s ease both; }
    @media (prefers-reduced-motion: reduce) { .fade-up { animation: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <!-- React 가 그려지기 전 잠깐 보이는 시작 화면 -->
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:sans-serif;color:#C98B73">
      <div style="font-size:48px">👶</div>
      <div>유이준 디지털 앨범을 여는 중…</div>
    </div>
  </div>

  <!-- React 18 (CDN) + JSX 변환용 Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- PWA: 설치 안내 이벤트 보관 + 서비스 워커 등록 -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__installPrompt = e;
      window.dispatchEvent(new Event('album-installable'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>

  <!-- Firebase 연동 모듈 → window.AlbumFirebase -->
  <script type="module" src="firebase.js"></script>
  <!-- 앱 UI -->
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
